<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>经期记录与预测助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌸 经期助手</h1>
            <p class="subtitle">记录 · 预测 · 关爱自己</p>
        </header>

        <div class="stats-card">
            <div class="stat-item">
                <span class="stat-label">平均周期</span>
                <span class="stat-value" id="avgCycle">--</span>
                <span class="stat-unit">天</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">平均经期</span>
                <span class="stat-value" id="avgPeriod">--</span>
                <span class="stat-unit">天</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">下次经期</span>
                <span class="stat-value" id="nextPeriod">--</span>
                <span class="stat-unit"></span>
            </div>
        </div>

        <div class="prediction-card" id="predictionCard">
            <div class="prediction-header">
                <span>📅 预测信息</span>
            </div>
            <div class="prediction-content" id="predictionContent">
                <p>添加记录后查看预测</p>
            </div>
        </div>

        <div class="form-section">
            <h2>📝 添加记录</h2>
            <div class="form-group">
                <label for="startDate">开始日期：</label>
                <input type="date" id="startDate" required>
            </div>
            <div class="form-group">
                <label for="endDate">结束日期：</label>
                <input type="date" id="endDate" required>
            </div>
            <button class="btn-primary" onclick="addPeriod()">添加记录</button>
        </div>

        <div class="history-section">
            <h2>📊 历史记录</h2>
            <div class="table-wrapper">
                <table id="historyTable">
                    <thead>
                        <tr>
                            <th>开始日期</th>
                            <th>结束日期</th>
                            <th>持续天数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr>
                            <td colspan="4" class="empty-state">暂无记录，请添加</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <button class="btn-secondary" onclick="clearAllData()">清空所有数据</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
